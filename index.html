<style>

/* painel */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin:22px 0 18px;overflow-x:auto}
.tab{border:0;background:transparent;padding:11px 14px;color:var(--tx2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;gap:7px;align-items:center;white-space:nowrap;transition:all .2s;border-radius:8px 8px 0 0}
.tab:hover{color:var(--tx);background:var(--mar-l)}.tab.on{color:var(--mar);border-bottom-color:var(--mar)}
.tab .cnt{font-size:11px;background:var(--errbg);color:var(--err);border-radius:999px;padding:1px 7px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:18px}
.stat{padding:14px 16px;transition:transform .25s var(--ease),box-shadow .25s}.stat:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.stat small{display:block;font-size:12px;color:var(--tx2);margin-bottom:4px}.stat b{font-size:26px;font-weight:600;font-family:'Bodoni Moda',serif}
.stat.err b{color:var(--err)}.stat.warn b{color:var(--warn)}.stat.ok b{color:var(--ok)}
.grid-p{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.pc{padding:18px 20px;cursor:pointer;transition:transform .25s var(--ease),border-color .25s,box-shadow .25s}.pc:hover{transform:translateY(-3px);border-color:var(--mar-b);box-shadow:var(--sh2)}
.pc h3{font-size:21px;margin-bottom:4px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-weight:600;font-size:12px;color:var(--tx2);text-transform:uppercase;letter-spacing:.6px;padding:10px 12px;border-bottom:1px solid var(--bd);background:var(--bg)}
table.t td{padding:11px 12px;border-bottom:1px solid var(--bd);vertical-align:top;transition:background .15s}
table.t tbody tr:hover td{background:var(--mar-l)}
table.t tr.dv td{background:var(--errbg)}table.t tr.dv td:first-child{box-shadow:inset 3px 0 0 var(--err)}
.ans{font-weight:500}.ans.ns{color:var(--warn)}.ans.vz{color:var(--tx3);font-weight:400;font-style:italic}
.ad{display:block;font-size:12.5px;color:var(--tx2);margin-top:3px;white-space:pre-wrap}
.tw{overflow-x:auto;border-radius:var(--rad)}
.mchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.mchip{border:1px solid var(--bd2);background:var(--card);color:var(--tx2);padding:6px 11px;border-radius:999px;font-size:12.5px;display:inline-flex;gap:6px;align-items:center;transition:all .2s var(--ease)}
.mchip:hover{border-color:var(--mar);color:var(--mar);transform:translateY(-1px)}
.mchip.on{background:var(--mar);border-color:var(--mar);color:#fff}.mchip .d{background:var(--err);color:#fff;border-radius:999px;font-size:10.5px;padding:0 6px}
.an{padding:20px 22px;margin-bottom:16px;transition:box-shadow .25s}.an:hover{box-shadow:var(--sh2)}
.an-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.an-g{display:grid;grid-template-columns:1fr 1fr;gap:16px}.an-g .full{grid-column:1/-1}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.box{background:var(--bg);border-radius:11px;padding:12px 14px;font-size:13.5px}.box ul{margin:0;padding-left:17px}.box li{margin:3px 0}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form .full{grid-column:1/-1}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:6px}
.mods label{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;padding:8px 10px;border-radius:9px;background:var(--bg);cursor:pointer;transition:background .2s}.mods label:hover{background:var(--mar-l)}.mods input{width:auto;margin-top:3px;accent-color:var(--mar)}
.fato-ed{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}.fato-ed .code{margin-top:12px}.fato-ed textarea{min-height:58px}
.login{max-width:420px;margin:9vh auto;padding:34px}
.empty{padding:40px;text-align:center;color:var(--tx2)}
.modal-bg{position:fixed;inset:0;background:rgba(20,10,12,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;animation:entra .25s both}
.modal{max-width:480px;width:100%;padding:26px;animation:pop .35s var(--ease)}
.demo{background:var(--warnbg);color:var(--warn);font-size:12.5px;text-align:center;padding:7px 12px}
.risk-alto{color:var(--err)}.risk-medio{color:var(--warn)}.risk-baixo{color:var(--ok)}
#print{display:none}
@media (max-width:900px){.an-g,.form,.f3{grid-template-columns:1fr}}
@media print{body{background:#fff;color:#000}#app,.toast,.modal-bg{display:none!important}#print{display:block;font-family:Jost,Arial,sans-serif;font-size:11px;color:#000}
#print h1{font-size:22px}#print h2{font-size:16px;margin:16px 0 6px;color:#632022;border-bottom:1px solid #ccc;padding-bottom:3px}#print table{width:100%;border-collapse:collapse;margin:6px 0}#print td,#print th{border:1px solid #ccc;padding:4px 6px;vertical-align:top;text-align:left}#print tr.dv td{background:#fbe8ea}#print .pf{margin-top:20px;font-size:9px;color:#555;border-top:1px solid #ccc;padding-top:6px}#print section{page-break-inside:avoid}
.rc{max-width:640px;margin:0 auto;font-size:12px}.rc-h{display:flex;gap:16px;align-items:center;background:#632022!important;color:#fff;padding:18px 20px;border-radius:10px;-webkit-print-color-adjust:exact;print-color-adjust:exact}.rc-h img{height:40px}.rc-h b{display:block;font-size:17px}.rc-h span{font-size:11px;color:#e9d9c4}
.rc h4{color:#632022;margin:16px 0 6px;font-size:12px;letter-spacing:1px;text-transform:uppercase}.rc .rc-t th{width:30%;background:#f6ecec;-webkit-print-color-adjust:exact;print-color-adjust:exact}.rc-f{margin-top:22px;padding-top:8px;border-top:1px solid #ccc;font-size:9.5px;color:#555;text-align:center;line-height:1.6}}

/* ===================== EXPERIÊNCIA DO CLIENTE (VIP) ===================== */
body.vip{background:#fbf8f3;color:#251c1c;font:300 17px/1.7 Jost,system-ui,sans-serif}
.vx{--mar:#5c1c20;--gold:#c6a36f;--gold2:#a9844f;--ivory:#fbf8f3;--paper:#fffdf9;--ink:#251c1c;--mute:#7a6e6b;--line:#e8dfd3;color:var(--ink)}
.vx *{box-sizing:border-box;min-width:0}
.v-scr{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;animation:vAbre .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes vAbre{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.v-capa{background:radial-gradient(110% 80% at 50% 10%,#6e2429 0%,#5c1c20 60%,#4a161b 100%);color:#fbf8f3;align-items:center;justify-content:center;text-align:center;padding:48px 28px;position:relative;overflow:hidden}
.v-capa::before{content:'';position:absolute;inset:22px;border:1px solid rgba(198,163,111,.28);pointer-events:none}
.v-capa .v-logo{height:50px;margin-bottom:64px;opacity:.95}
.v-capa h1{font:400 clamp(42px,7.4vw,68px)/1.02 'Bodoni Moda',serif;margin:0 0 10px;letter-spacing:-.01em;color:#fbf8f3}
.v-capa h1 i{font-weight:400}
.v-sub{font:italic 400 clamp(17px,2.4vw,21px)/1.3 'Bodoni Moda',serif;color:#e9dccb;margin-bottom:26px}
.v-fil{width:64px;height:1px;background:var(--gold);margin:0 auto 26px}
.v-nome{font:italic 400 clamp(24px,4vw,30px)/1.2 'Bodoni Moda',serif;color:#fff}
.v-capa .v-bt{margin-top:48px}
.v-ret{margin-top:14px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.v-capa .v-lk{color:#cdb9a3;margin-top:14px}.v-capa .v-lk:hover{color:#fff}
.v-capa p{max-width:460px;color:#e9dccb;margin:0 auto}
.v-bt{display:inline-flex;align-items:center;gap:14px;border:1px solid var(--gold);background:transparent;color:inherit;padding:16px 30px;font:400 14px Jost,sans-serif;letter-spacing:.16em;text-transform:uppercase;transition:all .35s ease;text-decoration:none;cursor:pointer;border-radius:0}
@media (hover:hover){.v-bt:hover{background:var(--gold);color:var(--mar)}}
.v-bt .v-ar{transition:transform .35s}@media (hover:hover){.v-bt:hover .v-ar{transform:translateX(5px)}}
.v-bt.esc{background:var(--mar);border-color:var(--mar);color:var(--ivory)}@media (hover:hover){.v-bt.esc:hover{background:#43141a;border-color:#43141a;color:#fff}}
.v-bt:disabled{opacity:.5;cursor:default}
.v-lk{background:none;border:0;color:var(--mute);font:400 14px Jost,sans-serif;letter-spacing:.04em;padding:10px 0;border-bottom:1px solid transparent;transition:all .25s;cursor:pointer;text-decoration:none}.v-lk:hover{color:var(--mar);border-color:var(--gold)}
.v-top{display:flex;align-items:center;gap:14px;padding:16px clamp(20px,5vw,48px);border-bottom:1px solid var(--line);background:var(--ivory);position:sticky;top:0;z-index:5}
.v-top img{height:26px}.v-top .t{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.v-top .sp{flex:1}
.v-top .v-lk{font-size:12px;letter-spacing:.18em;text-transform:uppercase;padding:4px 0}
.v-salvo{font-size:12.5px;letter-spacing:.08em;color:var(--mute);display:flex;align-items:center;gap:8px;white-space:nowrap}.v-salvo::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--gold);transition:background .3s}.v-salvo.on::before{background:var(--mar);animation:pul 1s infinite}
.v-barra{height:2px;background:var(--line)}.v-barra i{display:block;height:2px;background:var(--gold);transition:width .8s cubic-bezier(.2,.7,.2,1)}
.v-pg{flex:1;width:100%;max-width:680px;margin:0 auto;padding:clamp(40px,8vh,90px) 28px 40px;display:flex;flex-direction:column}
.v-pg h2{font:400 clamp(32px,5vw,46px)/1.1 'Bodoni Moda',serif;margin:10px 0 28px;letter-spacing:-.01em;text-wrap:balance;color:var(--ink)}
.v-pg p{margin:0 0 18px}
.v-carta{max-width:980px}.v-carta p{font-size:18px}.v-saud{font:italic 400 30px/1.2 'Bodoni Moda',serif;margin-bottom:26px}
.v-cg{display:grid;grid-template-columns:300px minmax(0,1fr);gap:clamp(36px,5vw,64px);align-items:start}
.v-ft{margin:8px 0 0}.v-ph{position:relative}
.v-ph img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 20%;position:relative;z-index:1}
.v-ph::before{content:'';position:absolute;inset:14px -14px -14px 14px;border:1px solid var(--gold)}
.v-ft figcaption{margin-top:26px;font:italic 400 18px/1.3 'Bodoni Moda',serif;color:var(--mar)}
.v-ft figcaption span{display:block;margin-top:4px;font:400 12px Jost,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.v-ass{margin-top:30px;padding-top:22px;border-top:1px solid var(--line)}
.v-ass b{display:block;font:italic 400 26px/1.2 'Bodoni Moda',serif;color:var(--mar)}
.v-ass span{font-size:13px;letter-spacing:.08em;color:var(--mute)}
.v-af{display:flex;gap:18px;align-items:center}
.v-af img{width:72px;height:72px;border-radius:50%;object-fit:cover;object-position:50% 18%;border:1px solid var(--gold);padding:3px;background:var(--paper);flex:none}
.v-rod{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:auto;padding-top:42px;flex-wrap:wrap}
.v-comb{border-top:1px solid var(--line)}.v-comb p{padding:20px 0;margin:0;border-bottom:1px solid var(--line);font-size:16.5px}
.v-nota-s{font-size:13.5px;color:var(--mute);margin-top:22px}
.v-ctx{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold2)}
.v-ind{list-style:none;padding:0;margin:0}
.v-ind button{display:flex;align-items:baseline;gap:16px;width:100%;padding:15px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font:inherit;color:inherit;transition:all .3s;cursor:pointer}
@media (hover:hover){.v-ind button:hover{padding-left:12px;background:var(--paper)}}
.v-ind .r{font:italic 400 15px 'Bodoni Moda',serif;color:var(--gold2);width:34px;flex:none}
.v-ind .n{flex:1;font-size:16.5px}.v-ind .m{font-size:13px;color:var(--mute);white-space:nowrap}
.v-ind .fe .n{color:var(--mute)}.v-ind .fe .m{color:var(--gold2)}
.v-ind .at .n{color:var(--mar);font-weight:400}
.v-abre{background:var(--mar);color:var(--ivory)}
.v-abre .v-pg{justify-content:center}
.v-abre .v-ok{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:34px;display:flex;align-items:center;gap:10px}.v-abre .v-ok::before{content:'';width:22px;height:1px;background:var(--gold)}
.v-abre .num{font:italic 400 20px 'Bodoni Moda',serif;color:var(--gold)}
.v-abre h2{color:#fff;font-size:clamp(40px,7vw,60px)}
.v-nota{border-left:1px solid var(--gold);padding-left:22px;font-size:17.5px;color:#eadfce}
.v-nota em{display:block;margin-top:14px;font:italic 400 15px 'Bodoni Moda',serif;color:var(--gold)}
.v-abre .tm{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#cdb9a3;margin-top:30px}
.v-abre .v-lk{color:#cdb9a3}.v-abre .v-lk:hover{color:#fff}
.v-q{font:400 clamp(27px,4.4vw,36px)/1.25 'Bodoni Moda',serif;margin:14px 0 30px;text-wrap:balance}
.v-ops{display:grid;gap:10px}
.v-op{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);padding:18px 22px;font:400 17px Jost,sans-serif;color:var(--ink);transition:all .3s cubic-bezier(.2,.7,.2,1);position:relative;cursor:pointer;border-radius:0}
.v-op::before{content:'';position:absolute;left:0;top:0;bottom:0;width:0;background:var(--gold);transition:width .3s}
@media (hover:hover){.v-op:hover{border-color:var(--gold);transform:translateX(4px);box-shadow:0 10px 30px -18px rgba(92,28,32,.45)}.v-op:hover::before{width:3px}}
.v-op .ck{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;transition:all .3s}
.v-op.sel{background:var(--mar);border-color:var(--mar);color:var(--ivory)}.v-op.sel .ck{background:var(--gold);border-color:var(--gold)}
.v-op.sel .ck::after{content:'';width:6px;height:10px;border:solid var(--mar);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.v-op.ns{color:var(--mute);font-style:italic}.v-op.ns.sel{color:var(--ivory)}
.v-op.mini{padding:9px 14px;font-size:14px;display:inline-flex;width:auto}.v-op.mini .ck{width:16px;height:16px}
.v-porq{margin-top:28px;font:italic 400 16px/1.6 'Bodoni Moda',serif;color:var(--mute);padding-left:18px;border-left:1px solid var(--gold)}
.vx .v-campo{width:100%;border:0;border-bottom:1px solid var(--ink);border-radius:0;background:transparent;font:400 22px Jost,sans-serif;color:var(--ink);padding:10px 2px;outline:none;box-shadow:none;transition:border-color .3s}
.vx .v-campo:focus{border-color:var(--gold);box-shadow:none}
.vx textarea.v-campo{border:1px solid var(--line);background:var(--paper);font-size:17px;line-height:1.65;padding:18px;min-height:150px;resize:vertical}
.vx textarea.v-campo.det{min-height:110px;margin-top:18px}
.vx input[type=date].v-campo{max-width:280px}
.vx .v-campo:disabled{opacity:.4}
.v-chk{display:flex;gap:12px;align-items:center;margin-top:18px;font-size:15px;color:var(--mute);cursor:pointer}
.vx .v-chk input,.vx .v-priv input{width:18px;height:18px;padding:0;accent-color:var(--mar);flex:none}
.v-priv{margin-top:14px;display:flex;gap:12px;align-items:flex-start;padding:16px 18px;border:1px dashed var(--gold);font-size:15px;color:var(--ink);cursor:pointer;transition:background .3s}
.v-priv:hover{background:var(--paper)}.v-priv input{margin-top:5px}
.v-priv small{display:block;color:var(--mute);font-size:13.5px}
.v-priv.on{background:var(--paper);border-style:solid}
.v-mais{margin-top:16px;align-self:flex-start}
.v-hint{font-size:14px;color:var(--mute);margin-top:12px}
.v-trecho{position:relative;background:var(--paper);border:1px solid var(--line);padding:30px 28px 26px;margin:44px 0 30px;font:400 19px/1.6 'Bodoni Moda',serif}
.v-trecho::before{content:'\201C';position:absolute;top:-30px;left:18px;font:400 84px/1 'Bodoni Moda',serif;color:var(--gold)}
.v-trecho small{display:block;margin-top:16px;font:400 12px Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.v-docs{border-top:1px solid var(--line)}
.v-docs .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.v-docs .row>span{flex:1 1 240px;font-size:16px}.v-docs .row .ops{display:flex;gap:8px;flex-wrap:wrap}
.v-sug{margin:0 0 24px;padding:0;list-style:none;border-top:1px solid var(--line)}.v-sug li{padding:12px 0;border-bottom:1px solid var(--line);font-size:16px}.v-sug li::before{content:'';display:inline-block;width:14px;height:1px;background:var(--gold);vertical-align:middle;margin-right:12px}
.v-drop{display:flex;flex-direction:column;align-items:center;gap:6px;border:1px dashed var(--gold);padding:30px 24px;text-align:center;cursor:pointer;color:var(--mute);transition:all .3s;background:var(--paper)}
.v-drop:hover,.v-drop.drag{background:#f6efe4;border-style:solid}
.v-drop b{font:italic 400 21px 'Bodoni Moda',serif;color:var(--mar)}.v-drop span{font-size:13.5px}
.v-fl{list-style:none;padding:0;margin:14px 0 0}.v-fl li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}.v-fl .fn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.v-fl .ok{color:var(--gold2);font-size:12px;letter-spacing:.14em;text-transform:uppercase}.v-fl .er{color:#a3303c;font-size:13px}
.v-fl .pb{flex:0 0 90px;height:2px;background:var(--line)}.v-fl .pb i{display:block;height:2px;background:var(--gold);transition:width .3s}
.v-selo{width:84px;margin:0 auto 26px;display:block}
.v-fim h2{text-align:center}
.v-prot{display:grid;grid-template-columns:auto 1fr;gap:6px 22px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px 4px;margin:26px 0;font-size:15px}
.v-prot span{color:var(--mute);letter-spacing:.06em}.v-prot b{font-weight:500}
.v-modal{position:fixed;inset:0;background:rgba(37,28,28,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:18px;animation:entra .25s both}
.v-modal>div{background:var(--ivory);max-width:520px;width:100%;padding:38px 34px 30px;border-top:2px solid var(--gold);max-height:90vh;overflow:auto}
.v-modal h3{font:400 30px/1.15 'Bodoni Moda',serif;margin:0 0 16px}
.v-modal ul{list-style:none;padding:0;margin:8px 0 18px;border-top:1px solid var(--line)}.v-modal li{border-bottom:1px solid var(--line)}
.v-modal li button{background:none;border:0;width:100%;text-align:left;padding:12px 2px;font:400 16px Jost,sans-serif;color:var(--mar);cursor:pointer;display:flex;justify-content:space-between}.v-modal li button:hover{padding-left:8px}
.v-modal li small{color:var(--mute);font-size:13px}
.v-demo{background:#1d1616;color:#e9dccb;font-size:12px;letter-spacing:.06em;text-align:center;padding:7px 12px}
body.vip .toast{background:#251c1c;color:#fbf8f3;border-radius:0;font-family:Jost,sans-serif}
body.vip .toast.marco{background:#5c1c20;border:1px solid #c6a36f;font:italic 400 16px 'Bodoni Moda',serif}
body.vip .toast.marco::before{background:#c6a36f}
@media (max-width:760px){.v-cg{grid-template-columns:1fr;gap:34px}.v-ft{max-width:220px}.v-ft figcaption{margin-top:22px}}

   Variáveis do caso: {E} {REG} {INI} {LOJA} {ANO13} {DESC} {DATA13} {PERIODO} */

const MODULOS = [
{ id: 'm1', t: 'Você e a empresa', curto: 'Você e a empresa',
  nota: 'Antes de entrarmos nos fatos, quero conhecer quem está do outro lado desta conversa e como a empresa funciona por dentro. São perguntas rápidas, mas me mostram quem decide, quem acompanhava o dia a dia e com quem falar sobre cada assunto.',
  obj: 'Para começar, quem está respondendo e como a administração da empresa se organiza.',
  anexos: ['Contrato social e alterações', 'Documento de identificação dos sócios'],
  q: [

  [9, 't', 'Quem definia os valores das comissões?'],

{ id: 'mF', dyn: true, t: 'Os fatos citados na reclamação', curto: 'Os fatos da reclamação',
  nota: 'Aqui estão, nas palavras do próprio reclamante, as situações que ele descreve no processo. Leia cada trecho com calma e me conte o que de fato aconteceu. Na contestação, cada fato precisa de uma resposta específica, e é a sua versão que vai dar forma a essa resposta.',
  obj: 'A reclamação descreve situações específicas, com datas. Para cada uma, diga se aconteceu e conte a sua versão. É a parte mais importante do diagnóstico: na defesa, cada fato precisa ser respondido um a um.',
  anexos: ['Conversas, fotos ou documentos que mostrem a versão da empresa sobre esses fatos'], q: [] },
{ id: 'm2', t: 'Como ele começou a trabalhar', curto: 'O início',

  obj: 'Esclarecer a alegação de que o trabalho começou em {INI}, embora a CTPS tenha sido anotada em {REG}.',
  anexos: ['Documentos de contratação', 'Conversas sobre o início do trabalho', 'Registros de pagamentos desse período', 'Eventuais contratos anteriores'],
  q: [

{ id: 'm4', t: 'Salário, comissões e pagamentos', curto: 'Pagamentos',
  nota: 'Dinheiro deixa rastro, e isso joga a nosso favor. Nesta etapa vamos reconstruir quanto {E} recebia e de que forma, a regra das comissões e a origem de cada pagamento. Se tiver extratos e comprovantes por perto, eles vão ajudar muito.',

  [73, 'sn', 'A empresa fornecia alimentação no local de trabalho?'],

        const path = `respostas/${t}/${Date.now()}_${safeName(f.name)}`;
        const task = st.uploadBytesResumable(st.ref(storage, path), f, { contentType: f.type || 'application/octet-stream' });
        task.on('state_changed', s => onp(Math.round(s.bytesTransferred / s.totalBytes * 100)), rej, () => res({ nome: f.name, path, tamanho: f.size, modulo: mid, em: Date.now() }));
      });
    },
    async fileUrl(path) { return st.getDownloadURL(st.ref(storage, path)); },
    onAuth(cb) { au.onAuthStateChanged(auth, cb); },
    async login(e, s) { await au.signInWithEmailAndPassword(auth, e, s); },
    async logout() { await au.signOut(auth); }
  };
}

function lista(i) { // perguntas visíveis da etapa, com o bloco a que pertencem

  return out;
}
function seq(i) {
  const m = R.mods[i], out = [{ s: 'abre', i }];
  lista(i).forEach(x => out.push({ s: 'q', i, n: x.q.n }));
  if (m.checklist) out.push({ s: 'ck', i });
  if ((m.anexos && m.anexos.length) || m.docs) out.push({ s: 'anx', i });

  return out;
}
const igual = (a, b) => a.s === b.s && a.i === b.i && (a.s !== 'q' || a.n === b.n);
const completa = i => { const s = statusMod(R.mods[i], R.ans); return s.tot > 0 && s.ok === s.tot; };
function pontoDaEtapa(i) { // onde retomar dentro da etapa
  const L = lista(i), feitas = L.filter(x => respondida(R.ans[qid(x.q.n)]));
  if (!feitas.length) return { s: 'abre', i };
  const pend = L.find(x => !respondida(R.ans[qid(x.q.n)]));
  if (pend) return { s: 'q', i, n: pend.q.n };
  const sq = seq(i); return sq[sq.length - 1].s === 'q' ? sq[1] : sq[sq.length - 1];
}
function pontoDeRetomada() {

  if (!R.ligado) { R.ligado = true; addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') descarregar(); }); addEventListener('pagehide', descarregar); }

function render() {

function ir(tela) {
  clearTimeout(R.autoT); descarregar();
  R.tela = tela;
  if (typeof tela.i === 'number' && tela.i !== R.passo) { R.passo = tela.i; backup(); API.patchResp(R.t, { passo: R.passo, progresso: progresso(R.ans, R.mods) }).catch(() => { }); }
  render(); window.scrollTo(0, 0);
}
function prox() {
  const t = R.tela, sq = seq(t.i), k = sq.findIndex(x => igual(x, t));
  if (k >= 0 && k < sq.length - 1) return ir(sq[k + 1]);
  if (t.i < R.mods.length - 1) return ir({ s: 'abre', i: t.i + 1 });
  ir({ s: 'decl', i: t.i });
}
function ant() {
  const t = R.tela, sq = seq(t.i), k = sq.findIndex(x => igual(x, t));
  if (k > 0) return ir(sq[k - 1]);
  if (t.i > 0) { const s2 = seq(t.i - 1); return ir(s2[s2.length - 1]); }
  ir({ s: 'sum' });
}

    const et = el.closest('[data-etapa]'); if (et) return ir(pontoDaEtapa(+et.dataset.etapa));
    const cm = el.closest('[data-comecar]'); if (cm) { const i = +cm.dataset.comecar; const p = pontoDaEtapa(i); const sq = seq(i); return ir(p.s === 'abre' ? (sq[1] || { s: 'abre', i: i + 1 }) : (completa(i) ? sq[1] : p)); }
    if (el.closest('[data-prox]')) return prox();

    const b = el.closest('[data-act]');
    if (b) {
      const k = b.dataset.q, v = b.dataset.v; const a = R.ans[k] = { ...(R.ans[k] || {}) };
      if (b.dataset.act === 'pick') a.v = a.v === v ? null : v;
      else { let arr = Array.isArray(a.v) ? [...a.v] : []; if (v === 'Não sei') arr = arr.includes(v) ? [] : [v]; else { arr = arr.filter(x => x !== 'Não sei'); arr = arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v]; } a.v = arr; }

    else a[f] = el.value;

    ${FICHA.map(([k, t, w]) => `<div class="${w}"><span class="lbl">${esc(t)}</span>${k === 'socios' || k === 'fobs' ? `<textarea data-fc="${k}" rows="2">${esc((p.ficha || {})[k] || '')}</textarea>` : `<input data-fc="${k}" value="${esc((p.ficha || {})[k] || '')}">`}</div>`).join('')}</div></div>
  <div class="card in" style="padding:22px;margin-bottom:16px"><h3>Fatos citados na reclamação</h3><p class="small muted" style="margin:4px 0 14px">Cada fato vira uma pergunta da etapa "Os fatos citados na reclamação": o cliente diz se aconteceu e conta a versão dele. Ficam só no banco de dados, nunca no código publicado.</p><div id="esp-box">${editorFatos()}</div></div>
  <div class="card in" style="padding:22px;margin-bottom:16px"><h3>Dados do caso usados nas perguntas</h3><p class="small muted" style="margin:4px 0 14px">Ao salvar, os links já gerados são atualizados.</p><div class="form">
    ${Object.entries(PH_ROTULOS).map(([k, t]) => `<div><span class="lbl">${esc(t)}</span><input data-ph="${k}" value="${esc(ph[k] || '')}" placeholder="${esc(PH_PADRAO[k])}"></div>`).join('')}</div></div>
  <div class="card in" style="padding:22px;margin-bottom:16px"><h3>Etapas ativas neste processo</h3><p class="small muted" style="margin:4px 0 14px">Desative o que não se aplica ao caso. Vale para os próximos links gerados.</p>
    <div class="mods">${MODULOS.map(m => `<label><input type="checkbox" class="cf-m" value="${m.id}" ${FIXOS.includes(m.id) ? 'checked disabled' : at.includes(m.id) ? 'checked' : ''}> ${esc(fill(m.t, ph))}</label>`).join('')}</div></div>
  <div class="card in" style="padding:22px;margin-bottom:16px"><h3>Notas de abertura das etapas</h3><p class="small muted" style="margin:4px 0 14px">É a mensagem assinada por você que o cliente lê ao entrar em cada etapa. Deixe em branco para usar o texto padrão (aparece em cinza). Pode usar as variáveis do caso, como {E} e {INI}.</p>
    ${MODULOS.filter(m => m.nota).map(m => `<div style="margin-bottom:12px"><span class="lbl">${esc(m.curto || m.t)}</span><textarea data-nota="${m.id}" rows="3" placeholder="${esc(m.nota)}">${esc((p.notas || {})[m.id] || '')}</textarea></div>`).join('')}</div>
  <div class="nav" style="margin:0 0 24px;justify-content:flex-end"><button class="btn pri lg" id="cf-salvar">${ic('check')} Salvar alterações</button></div>
  <div class="card in" style="padding:22px;margin-bottom:16px"><h3>Importar dados do caso</h3><p class="small muted" style="margin:4px 0 12px">Cole aqui o texto de importação preparado pelo Claude (formato JSON) para preencher dados, variáveis, fatos da reclamação e alegações da inicial de uma vez.</p>
    <textarea id="cf-json" rows="6" placeholder='{"titulo": "...", "placeholders": {...}, "especificas": [...], "analise": {...}}' style="font-family:ui-monospace,Menlo,monospace;font-size:12.5px"></textarea>
    <div class="nav" style="justify-content:flex-end"><button class="btn" id="cf-imp">${ic('upload')} Importar</button></div></div>
  <div class="card in" style="padding:22px;border-color:var(--errbg)"><h3>Excluir processo</h3><p class="small muted" style="margin:4px 0 12px">Remove o processo e todos os links e respostas. Os arquivos enviados continuam no armazenamento do Firebase.</p><button class="btn dan" id="cf-del">${ic('trash')} Excluir processo</button></div>`;
}
function ligarAba() {
  const p = A.proc;
  if (A.tab === 'respondentes') {
    const rel = $('#nr-rel'), rep = $('[data-rep]');
    const ajusta = () => { if (rep) rep.checked = rel.value === 'Sócio-administrador'; }; ajusta(); rel.onchange = ajusta;
    $('#nr-b').onclick = async () => {
      const nome = $('#nr-nome').value.trim(); if (!nome) { toast('Informe o nome do respondente.'); return; }
      const t = token(); const mods = $$('.nr-m').filter(x => x.checked).map(x => x.value);
      try { await API.createResp(t, { processoId: p.id, processoNumero: p.numero || '', nome, relacao: rel.value, empresa: nomeEmpresa(p), notas: p.notas || {}, modulos: mods, placeholders: p.placeholders || {}, especificas: p.especificas || [], driveLink: p.driveLink || '', prazo: p.prazo || '', answers: {}, arquivos: [], status: 'pendente', progresso: 0, passo: -1 }); }
      catch (e) { console.error(e); toast('Não foi possível gerar o link.'); return; }
      A.resps = await API.listResp(p.id); telaProc(); copiar(linkResp(t));
    };
    $$('[data-copy]').forEach(b => b.onclick = () => copiar(linkResp(b.dataset.copy)));
    $$('[data-msg]').forEach(b => b.onclick = () => copiar(msgWhats(A.resps.find(x => x.id === b.dataset.msg))));
    $$('[data-wa]').forEach(b => b.onclick = () => window.open('https://wa.me/?text=' + encodeURIComponent(msgWhats(A.resps.find(x => x.id === b.dataset.wa))), '_blank', 'noopener'));
    $$('[data-reabrir]').forEach(b => b.onclick = async () => { await API.patchResp(b.dataset.reabrir, { status: 'pendente' }); A.resps = await API.listResp(p.id); telaProc(); toast('Diagnóstico reaberto para edição', 'ok'); });
    $$('[data-del]').forEach(b => b.onclick = () => modal(`<h2>Excluir respondente?</h2><p class="muted">O link deixa de funcionar e as respostas são apagadas.</p>`, async () => { await API.deleteResp(b.dataset.del); A.resps = await API.listResp(p.id); telaProc(); }, 'Excluir', true));
  }
  if (A.tab === 'respostas') {
    $$('[data-mod]').forEach(b => b.onclick = () => { A.mod = b.dataset.mod; telaProc(); });
    const f = $('#filtro'); if (f) f.onchange = () => { A.filtro = f.value; telaProc(); };
  }
  if (A.tab === 'analise') {
    $$('[data-ver]').forEach(b => b.onclick = () => { A.mod = b.dataset.ver; A.tab = 'respostas'; telaProc(); });
    $$('[data-an]').forEach(card => {
      const mid = card.dataset.an;
      card.oninput = card.onchange = e => {
        const el = e.target; if (!el.dataset.f) return;
        p.analise[mid] = { ...(p.analise[mid] || {}), [el.dataset.f]: el.value };
        clearTimeout(A.anTimer); A.anTimer = setTimeout(async () => { try { await API.patchProc(p.id, { ['analise.' + mid]: p.analise[mid] }); toast('Análise salva', 'ok'); } catch (err) { console.error(err); toast('Erro ao salvar a análise'); } }, 900);
      };
    });
  }
  if (A.tab === 'documentos') {
    $$('[data-dl]').forEach(b => b.onclick = async () => { try { const u = await API.fileUrl(b.dataset.dl); if (u) window.open(u, '_blank', 'noopener'); else toast('No modo demonstração os arquivos não são armazenados.'); } catch (e) { console.error(e); toast('Não foi possível baixar o arquivo.'); } });
  }
  if (A.tab === 'exportar') {
    $('#ex-c').onclick = () => copiar($('#ex-t').value);
    $('#ex-p').onclick = () => { $('#print').innerHTML = htmlImpressao(); window.print(); };
  }
  if (A.tab === 'config') {
    const box = $('#esp-box');
    const ligaEsp = () => {
      box.oninput = e => { const i = e.target.dataset.esp; if (i != null) A.esp[+i].x = e.target.value; };
      $$('[data-espdel]', box).forEach(b => b.onclick = () => { A.esp.splice(+b.dataset.espdel, 1); box.innerHTML = editorFatos(); ligaEsp(); });
      $('#esp-add').onclick = () => { A.esp.push({ id: 'e' + Date.now().toString(36), x: '' }); box.innerHTML = editorFatos(); ligaEsp(); const t = $$('[data-esp]', box).pop(); t && t.focus(); };
    };
    ligaEsp();
    $('#cf-salvar').onclick = async () => {
      const ph = {}; $$('[data-ph]').forEach(i => ph[i.dataset.ph] = i.value.trim());
      const ficha = {}; $$('[data-fc]').forEach(i => ficha[i.dataset.fc] = i.value.trim());
      const notas = {}; $$('[data-nota]').forEach(i => { if (i.value.trim()) notas[i.dataset.nota] = i.value.trim(); });
      const especificas = A.esp.filter(f => String(f.x || '').trim()).map((f, i) => ({ id: f.id || 'e' + (i + 1), x: f.x.trim(), ...(f.pq ? { pq: f.pq } : {}) }));
      const dados = { titulo: $('#cf-titulo').value.trim(), numero: $('#cf-numero').value.trim(), vara: $('#cf-vara').value.trim(), reclamante: $('#cf-reclamante').value.trim(), audiencia: $('#cf-audiencia').value, prazo: $('#cf-prazo').value, driveLink: $('#cf-drive').value.trim(), obs: $('#cf-obs').value, placeholders: ph, especificas, ficha, notas, modulos: $$('.cf-m').filter(x => x.checked).map(x => x.value) };
      try { await API.patchProc(p.id, dados); Object.assign(p, dados); for (const r of A.resps) await API.patchResp(r.id, { placeholders: ph, especificas, driveLink: dados.driveLink, prazo: dados.prazo, processoNumero: dados.numero, empresa: nomeEmpresa(dados), notas }); toast('Alterações salvas', 'ok'); A.esp = null; A.resps = await API.listResp(p.id); telaProc(); }
      catch (e) { console.error(e); toast('Erro ao salvar.'); }
    };
    $('#cf-imp').onclick = async () => {
      let j; try { j = JSON.parse($('#cf-json').value); } catch (e) { toast('O texto colado não está no formato correto.'); return; }
      const dados = {}; ['titulo', 'numero', 'vara', 'reclamante', 'audiencia', 'prazo', 'driveLink', 'obs'].forEach(k => { if (j[k] != null) dados[k] = j[k]; });
      if (j.placeholders) dados.placeholders = { ...(p.placeholders || {}), ...j.placeholders };
      if (Array.isArray(j.modulos)) dados.modulos = j.modulos;
      if (Array.isArray(j.especificas)) dados.especificas = j.especificas;
      if (j.ficha) dados.ficha = { ...(p.ficha || {}), ...j.ficha };
      if (j.notas) dados.notas = { ...(p.notas || {}), ...j.notas };
      if (j.analise) { const an = { ...(p.analise || {}) }; Object.entries(j.analise).forEach(([k, v]) => an[k] = { ...(an[k] || {}), ...v }); dados.analise = an; }
      try {
        await API.patchProc(p.id, dados);
        for (const r of A.resps) { const up = {}; if (dados.placeholders) up.placeholders = dados.placeholders; if (dados.especificas) up.especificas = dados.especificas; if (dados.numero != null) up.processoNumero = dados.numero; if (dados.prazo != null) up.prazo = dados.prazo; if (dados.ficha) up.empresa = nomeEmpresa(dados); if (dados.notas) up.notas = dados.notas; if (Object.keys(up).length) await API.patchResp(r.id, up); }
        toast('Dados importados', 'ok'); abrirProc(p.id, 'config');
      } catch (e) { console.error(e); toast('Erro ao importar.'); }
    };
    $('#cf-del').onclick = () => modal(`<h2>Excluir este processo?</h2><p class="muted">Todos os links e respostas dos respondentes serão apagados. Essa ação não pode ser desfeita.</p>`, async () => { for (const r of A.resps) await API.deleteResp(r.id); await API.deleteProc(p.id); carregarLista(); }, 'Excluir definitivamente', true);
  }
}
function textoExport() {
  const p = A.proc, ph = p.placeholders, an = analisar(), L = [];
  L.push(CONFIG.sistema.toUpperCase() + ': RESPOSTAS E ANÁLISE');
  L.push(`Processo: ${p.numero || 'não informado'}${p.vara ? ' | ' + p.vara : ''} | Reclamante: ${p.reclamante || ph.E || 'não informado'}${p.audiencia ? ' | Audiência: ' + fmtData(p.audiencia) : ''}`);
  L.push(`Gerado em: ${fmtTs(Date.now())}`); L.push('');
  const fl = fichaLinhas(p); if (fl.length) { L.push('FICHA DA EMPRESA'); fl.forEach(([t, v]) => L.push(`- ${t}: ${v.replace(/\n/g, ' | ')}`)); L.push(''); }
  L.push('RESPONDENTES');
  A.resps.forEach(r => L.push(`- ${r.nome} (${r.relacao || 'relação não informada'}): ${r.status === 'enviado' ? 'enviado em ' + fmtTs(r.enviadoEm) + (r.protocolo ? ', protocolo ' + r.protocolo : '') : 'em preenchimento'}, ${r.progresso || 0}%${r.declaracao ? ', declaração assinada por ' + r.declaracao.nome : ''}`));
  L.push(''); L.push(`RESUMO: ${an.tot.div} divergências | ${an.tot.alto} alertas de risco alto | ${an.tot.ns} respostas "não sei" | ${an.tot.docs} arquivos`);
  if (p.obs) { L.push(''); L.push('OBSERVAÇÕES INTERNAS: ' + p.obs); }
  modsDoProc(p).forEach((m, i) => {
    const o = an.mods[m.id], a = p.analise[m.id] || {}, rs = A.resps.filter(r => modsDoResp(r).some(x => x.id === m.id));
    L.push(''); L.push(`=== ${i + 1}. ${fill(m.t, ph).toUpperCase()} ===`);
    if (!SEM_ANALISE.includes(m.id)) {
      L.push(`Classificação: ${a.classificacao || CLASSIF[0]} | Risco jurídico: ${a.risco ? RISCOS[a.risco] : 'não definido'}`);
      if (a.alegacao) L.push('Alegação da inicial: ' + a.alegacao);
      if (a.versao) L.push('Versão da empresa (síntese): ' + a.versao);
      if (a.testemunha) L.push('Testemunha: ' + a.testemunha);
      if (a.provas) L.push('Outras provas: ' + a.provas);
      if (a.providencia) L.push('Providência: ' + a.providencia);
      if (o.alertas.length) L.push('Alertas: ' + o.alertas.map(x => `${x.msg} [${x.nivel}] (${x.q.code}: ${x.quem.join(', ')})`).join('; '));
    }
    const divs = new Set(o.div.map(q => q.n)), vazias = [];
    m.Q.forEach(q => {
      const vis = rs.filter(r => visivel(q, r.answers || {})); if (!vis.length) return;
      const com = vis.filter(r => { const x = (r.answers || {})[qid(q.n)]; return respondida(x) || (x && x.d); });
      if (!com.length) { vazias.push(q.code); return; }
      L.push(`${q.code}. ${qTexto(q, ph)}`);
      com.forEach(r => { const x = (r.answers || {})[qid(q.n)]; L.push(`   ${r.nome}: ${respondida(x) ? fmtResp(q, x) : 'sem opção marcada'}${x.d ? ' | ' + (q.tp === 'fato' ? 'Versão: ' : 'Obs.: ') + x.d.replace(/\n/g, ' ') : ''}`); });
      const sem = vis.filter(r => !com.includes(r)); if (sem.length) L.push(`   (sem resposta: ${sem.map(r => r.nome).join(', ')})`);
      if (divs.has(q.n)) L.push('   [DIVERGÊNCIA ENTRE RESPONDENTES]');
    });
    if (vazias.length) L.push(`Ainda sem resposta de ninguém: ${vazias.join(', ')}`);
    if (m.checklist) m.checklist.forEach((x, k) => L.push(`- ${fill(x, ph)}: ` + rs.map(r => `${r.nome}: ${((r.answers || {})['doc' + k] || {}).v || 'sem resposta'}`).join(' | ')));
    if (m.id === 'm18') rs.forEach(r => { const d = (r.answers || {}).decl; L.push(`Declaração de veracidade: ${r.nome}: ${d && d.v ? 'confirmada, assinada como ' + (d.nome || '') : 'não confirmada'}`); });
    if (o.arqs.length) L.push('Arquivos: ' + o.arqs.map(f => `${f.nome} (${f.quem})`).join('; '));
  });
  L.push(''); L.push(SIGILO);
  return L.join('\n');
}
function htmlImpressao() {
  const p = A.proc, ph = p.placeholders, an = analisar();
  let h = `<h1>${esc(p.titulo || 'Processo')}</h1><p>${esc(CONFIG.sistema)}</p><p>${esc(p.numero || '')}${p.vara ? ' · ' + esc(p.vara) : ''}${p.audiencia ? ' · Audiência ' + fmtData(p.audiencia) : ''}</p><p>Respondentes: ${A.resps.map(r => `${esc(r.nome)} (${esc(r.relacao || '')}, ${r.progresso || 0}%)`).join('; ')}</p><p>${an.tot.div} divergências · ${an.tot.alto} alertas de risco alto · ${an.tot.ns} "não sei" · ${an.tot.docs} arquivos</p>`;
  const fl = fichaLinhas(p); if (fl.length) h += `<h2>Ficha da empresa</h2><table>${fl.map(([t, v]) => `<tr><th style="width:30%">${esc(t)}</th><td>${nl2br(v)}</td></tr>`).join('')}</table>`;
  modsDoProc(p).forEach((m, i) => {
    const o = an.mods[m.id], a = p.analise[m.id] || {}, rs = A.resps.filter(r => modsDoResp(r).some(x => x.id === m.id)), divs = new Set(o.div.map(q => q.n));
    h += `<section><h2>${i + 1}. ${esc(fill(m.t, ph))}</h2>`;
    if (!SEM_ANALISE.includes(m.id)) h += `<table><tr><th style="width:22%">Classificação</th><td>${esc(a.classificacao || CLASSIF[0])}</td><th style="width:16%">Risco</th><td>${a.risco ? RISCOS[a.risco] : 'não definido'}</td></tr>${a.alegacao ? `<tr><th>Alegação da inicial</th><td colspan="3">${nl2br(a.alegacao)}</td></tr>` : ''}${a.versao ? `<tr><th>Versão da empresa</th><td colspan="3">${nl2br(a.versao)}</td></tr>` : ''}${o.alertas.length ? `<tr><th>Alertas</th><td colspan="3">${o.alertas.map(x => esc(x.msg) + ' (' + esc(x.quem.join(', ')) + ')').join('<br>')}</td></tr>` : ''}${a.testemunha ? `<tr><th>Testemunha</th><td colspan="3">${nl2br(a.testemunha)}</td></tr>` : ''}${a.providencia ? `<tr><th>Providência</th><td colspan="3">${esc(a.providencia)}</td></tr>` : ''}</table>`;
    const linhas = m.Q.map(q => { const vis = rs.filter(r => visivel(q, r.answers || {})); if (!vis.length) return ''; return `<tr class="${divs.has(q.n) ? 'dv' : ''}"><td style="width:40%">${q.code}. ${esc(qTexto(q, ph))}</td>${rs.map(r => { const x = (r.answers || {})[qid(q.n)]; return `<td>${visivel(q, r.answers || {}) ? (respondida(x) ? esc(fmtResp(q, x)) : '<i>sem resposta</i>') + (x && x.d ? '<br><i>' + esc(x.d) + '</i>' : '') : '<i>não se aplica</i>'}</td>`; }).join('')}</tr>`; }).join('');
    if (linhas) h += `<table><tr><th>Pergunta</th>${rs.map(r => `<th>${esc(r.nome)}</th>`).join('')}</tr>${linhas}</table>`;
    h += `</section>`;
  });
  return h + `<div class="pf">${esc(SIGILO)} Gerado em ${fmtTs(Date.now())}.</div>`;
}
